theme = "gruvbox"

[editor]
scrolloff = 0
color-modes = true
true-color = true

[editor.cursor-shape]
insert = "bar"

[editor.gutters]
layout = ["spacer", "line-numbers", "spacer"]

[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true
wrap-indicator = ""

[editor.statusline]
right = ["version-control", "spacer", "file-line-ending", "spacer", "position-percentage"]

[keys.insert]
j = { k = "normal_mode" }
